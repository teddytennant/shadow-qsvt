[project]
name = "shadow-qsvt"
version = "0.1.0"
description = "Classical simulation of shadow QSVT observable estimates from Krylov moments."
requires-python = ">=3.10"
dependencies = ["jax>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
